# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2500m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable building projects in parallel
org.gradle.parallel=true

# Gradle caching allows reusing the build artifacts from a previous
# build with the same inputs. However, over time, the cache size will
# grow. Uncomment the following line to enable it.
#org.gradle.caching=true
#org.gradle.configuration-cache=true

# Allow AndroidX usage
android.useAndroidX=true

# NOTE: androidCompileSdkVersion / qtMinSdkVersion / qtTargetSdkVersion /
# androidBuildToolsVersion / androidNdkVersion / qtAndroidDir / qtGradlePluginType
# are injected/updated in-place by androiddeployqt at build time from the
# qmake-side ANDROID_MIN_SDK_VERSION / ANDROID_TARGET_SDK_VERSION variables
# (and from --android-platform, which defaults to the highest installed SDK
# platform). Do not hardcode them here; it would just be overwritten.
# As of this writing wfview.pro does not set ANDROID_MIN_SDK_VERSION /
# ANDROID_TARGET_SDK_VERSION, so this Qt 6.8.1 android_arm64_v8a kit's own
# defaults apply: min SDK 28 (mkspecs/qdevice.pri DEFAULT_ANDROID_PLATFORM,
# i.e. the NDK r26b floor this kit's native libs were built against) and
# target SDK 34 (mkspecs/android-clang/qmake.conf). compileSdkVersion is
# auto-selected as the highest installed platform (android-36.1 on this
# machine). See the wfview android/ packaging report for reconciliation
# notes against ANDROID_BUILD_NOTES.md's opus minSdk once that file exists.
